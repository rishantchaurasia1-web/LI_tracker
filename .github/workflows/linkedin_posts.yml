name: LinkedIn HR Post Watcher
on:
  schedule:
    # 3x/day at randomish hours (UTC). India = UTC+5:30.
    # 03:17 UTC = 08:47 IST | 09:43 UTC = 15:13 IST | 16:29 UTC = 21:59 IST
    - cron: '17 3 * * *'
    - cron: '43 9 * * *'
    - cron: '29 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-posts-watcher
  cancel-in-progress: false

jobs:
  watch_posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx beautifulsoup4 linkedin-api
      - name: Run post watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LI_EMAIL: ${{ secrets.LI_EMAIL }}
          LI_PASSWORD: ${{ secrets.LI_PASSWORD }}
        run: python linkedin_posts.py
      - name: Commit seen_jobs.txt if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.txt
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update seen_jobs.txt (posts)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
